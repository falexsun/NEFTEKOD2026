global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/q21_alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: neftekod-api
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          application: neftekod
          component: api
