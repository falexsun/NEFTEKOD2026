route:
  receiver: local-log
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-log

# Для промышленной среды добавьте согласованный webhook/email receiver.
# Пока Alertmanager сохраняет состояние и показывает активные тревоги в UI.
