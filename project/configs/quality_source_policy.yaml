# Quality Source Resolution Policy
# Each source has explicit priority (1=highest), max_age_minutes, confidence
# Resolution: try highest priority first, if stale try next

policy:
  sulfur:
    sources:
      - name: LIMS
        priority: 1
        max_age_minutes: 4320  # 3 days
        confidence: 0.95
        description: "Laboratory measurement"
      - name: PAK
        priority: 2
        max_age_minutes: 120
        confidence: 0.9
        description: "Online analyzer 24-2000:Mg.Sulfur"
      - name: VAK
        priority: 3
        max_age_minutes: 120
        confidence: 0.5
        description: "Virtual analyzer (formula-based)"

  density_15:
    sources:
      - name: LIMS
        priority: 1
        max_age_minutes: 4320
        confidence: 0.95
      - name: PAK
        priority: 2
        max_age_minutes: 120
        confidence: 0.9
