# Quality Source Resolution Policy
# Priority: LIMS > PAK > VAK
# But freshness matters — stale high-priority source < fresh lower-priority

policy:
  sulfur:
    sources:
      - name: PAK
        max_age_minutes: 120
        confidence: 0.9
        description: "Online analyzer 24-2000:Mg.Sulfur"
      - name: LIMS
        max_age_minutes: 4320  # 3 days
        confidence: 0.95
        description: "Laboratory measurement"
      - name: VAK
        max_age_minutes: 120
        confidence: 0.5
        description: "Virtual analyzer (formula-based)"
    fallback_policy: "ABSTAIN if all sources stale or unavailable"

  density_15:
    sources:
      - name: PAK
        max_age_minutes: 120
        confidence: 0.9
        description: "Online analyzer 24-2000:D15"
      - name: LIMS
        max_age_minutes: 4320
        confidence: 0.95
        description: "Laboratory measurement"
    fallback_policy: "ABSTAIN if all sources stale or unavailable"

resolution_rules:
  - "Use highest-priority source that is fresh (age <= max_age_minutes)"
  - "If PAK sulfur is stale but LIMS is fresh, use LIMS"
  - "If both are stale, report stale and ABSTAIN for optimization"
  - "VAK only if no PAK or LIMS available"
  - "Never combine sources without explicit policy"
