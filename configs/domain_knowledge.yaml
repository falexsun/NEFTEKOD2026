# VAK formulas from Теги_хакатон.xlsx (virtual analyzer definitions)
vak_formulas:
  hydrofining_sulfur:
    target: "24-2000:Mg.Sulfur"
    formula: "W7"  # Direct online analyzer reading
    confidence: high
    description: "Поточный анализатор серы в гидроочищенном ДТ"

  hydrofining_density:
    target: "24-2000:D15"
    formula: "667.881 + 0.15417*LIMS:24-2000.Pipeline.D15 + 0.00005*F22 + 0.10774*T11"
    confidence: medium
    description: "Расчетная плотность при 15°C"

  hydrofining_t90:
    target: "24-2000:GODT:T90"
    formula: "162.998 + 0.12945*T12 + 59.57*F15 + 0.00036*W7 + T23*0.26366 - 424.72638*F1/F26"
    confidence: medium
    description: "90% перегонки ГОДТ"
